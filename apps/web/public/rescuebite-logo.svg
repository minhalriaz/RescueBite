<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="500" height="150">
  <!-- 
    RescueBite Logo
    - Icon: partial ring + sprout in green #7CB342
    - Text: "Rescue" in #3A3A3A, "Bite" in #7CB342
    - viewBox: 0 0 500 150
  -->
  <defs>
    <style>
      .logo-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
      .logo-green { fill: #7CB342; }
      .logo-dark { fill: #3A3A3A; }
      .logo-stroke { stroke: #7CB342; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>

  <!-- Icon group -->
  <g id="icon" transform="translate(18 28)">
    <!-- outer thin circle -->
    <circle cx="52" cy="52" r="48" class="logo-stroke" stroke-width="4"/>
    <!-- inner partial ring with gap at top-right -->
    <path d="M52 12 A40 40 0 1 1 28 16" class="logo-stroke" stroke-width="5"/>
    <!-- sprout: single stem from bottom center -->
    <line x1="52" y1="80" x2="52" y2="48" class="logo-stroke" stroke-width="5"/>
    <!-- two leaves -->
    <path d="M52 64 C52 64, 36 56, 36 44 C36 32, 52 36, 52 48 C52 36, 68 32, 68 44 C68 56, 52 64, 52 64Z" class="logo-stroke" stroke-width="5" fill="none"/>
  </g>

  <!-- Text group -->
  <g id="text" class="logo-text" font-size="72" y="92">
    <!-- Rescue in dark gray -->
    <text x="124" class="logo-dark">Rescue</text>
    <!-- Bite in green -->
    <text x="328" class="logo-green">Bite</text>
  </g>
</svg>
